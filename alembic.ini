# Two schemas, two independent revision lines — DATABASE.md 13.4.
#
#   alembic -n tenant  upgrade head     (run once per tenant database)
#   alembic -n control upgrade head     (run once per installation)
#
# A tenant revision must never be applied to the control database, or the
# reverse. Separate directories and separate version tables enforce this.

[alembic]
# Placeholder so bare `alembic` invocations fail loudly rather than guessing.
script_location = migrations/tenant
sqlalchemy.url =

[tenant]
script_location = migrations/tenant
version_table = alembic_version_tenant
# URL comes from GL_TENANT_DB_URL at runtime — see migrations/tenant/env.py.
# Never committed. TRD 12.5: no secret is committed to the repository.
sqlalchemy.url =

[control]
script_location = migrations/control
version_table = alembic_version_control
# URL comes from GL_CONTROL_DB_URL at runtime.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
