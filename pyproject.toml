[project]
name = "guardian-lens"
version = "0.1.0"
description = "AI safety layer for existing workplace cameras — schema and business-rule enforcement"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "sqlalchemy>=2.0",
    # Control plane (TRD 3: FastAPI stack)
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "pyjwt>=2.8",
    "argon2-cffi>=23.1",
    "python-multipart>=0.0.9",
    # Edge publisher and API tests
    "httpx>=0.27",
    # Camera-credential sealing (TRD 12.4 AES-256-GCM). Installing this
    # auto-activates AesGcmCredentialSealer when GL_CAMERA_KEY is set; the
    # RS256 token swap (services/tokens.py) remains a separate [V1] step.
    "cryptography>=42",
]

[project.optional-dependencies]
# RTSP decode is edge-plane only and heavy; the control plane, CI's
# workflow suites and the synthetic path never need it (TRD 13.2).
edge-camera = [
    # Keep the deployed camera path on the established OpenCV 4 API/FFmpeg
    # behaviour; OpenCV 5 is not yet covered by the RTSP integration suite.
    "opencv-python-headless>=4.9,<5",
]
dev = [
    "bandit>=1.7",
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    # The bypass suite is the executable form of the business rules
    # (TRD 19.4). These markers keep the two rule states separable.
    "active_rule(id): asserts a rule that is ACTIVE in RULE_BOOK.md 10. Release-blocking.",
    "proposed_rule(id): asserts a rule still PROPOSED. Informational until ratified.",
    "coherence: asserts a schema invariant that is not itself a numbered rule.",
    "tenancy: asserts an ADR-016 isolation property.",
]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["guardian_lens"]
branch = true

[tool.coverage.report]
# TRD 19.2 sets 80% overall and 100% on business-rule guards. The guards are
# service-layer objects that do not exist yet (TRD 20.2 step 2), so the
# 100% line is not yet assertable and is deliberately not faked here.
fail_under = 80
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
